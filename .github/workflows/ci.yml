name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mechanism tests
        run: node --test tests/
      - name: index.html is up to date with src/
        run: ./build.sh && git diff --exit-code index.html
